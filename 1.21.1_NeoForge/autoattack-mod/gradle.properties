# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -Dorg.gradle.daemon=true
org.gradle.parallel=true

# 延长 HTTP 超时（国内网络下载 NeoForge 依赖较慢）
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
# 让 Gradle daemon 用 Windows 根证书库（解决下载 MC assets 时的 PKIX 证书错误）
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT

# ★ 本地 JDK 路径根据你的环境修改
# Windows: 填你的 JDK 21 路径
# Linux/macOS: 注释掉本行即可（Gradle 会自动从 PATH 找到 java）
# org.gradle.java.home=D:/ProgramData/Java/jdk-21

# NeoForge Properties
# neoforge_version 请对照官方 maven.neoforged.net 上的稳定版核实后填写
minecraft_version=1.21.1
neoforge_version=21.1.169

# Mod Properties
mod_version=1.0.0
mod_group_id=dev.gamebuddy
mod_id=autoattack
archives_base_name=AutoAttackCooldown
