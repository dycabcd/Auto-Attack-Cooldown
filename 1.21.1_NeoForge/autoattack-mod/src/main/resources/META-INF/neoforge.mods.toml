modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
side="CLIENT"

[[mods]]
    modId="autoattack"
    version="${version}"
    displayName="AutoAttackCooldown"
    logoFile="autoattack.png"
    credits="GameDesigner"
    authors="GameDesigner"
    description='''
长按攻击键，在攻击冷却完全恢复的瞬间自动出手。
基于原版冷却机制，自动适配所有武器（含其他模组的自定义武器）。
纯客户端，单人/多人通用。
    '''
    # 配置界面由 AutoAttackClient 通过 ModContainer.registerExtensionPoint 程序化注册
    # （IConfigScreenFactory），无需在此声明 configScreen 字段

# ★ NeoForge 1.21.1 通过 mods.toml 的 [[mixins]] 段加载 mod 的 Mixin 配置
# （不读 jar manifest 的 MixinConfigs 属性；不声明则 Mixin 不会被加载）
[[mixins]]
    config = "autoattack.mixins.json"

[[dependencies.autoattack]]
    modId="neoforge"
    mandatory=true
    versionRange="[21.1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.autoattack]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="CLIENT"
